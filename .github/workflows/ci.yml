name: ci
on:
  # push on all branches (no pull_request: bot-created PRs get held in action_required). strict protection forces the
  # branch to contain main's head, so testing the branch head equals testing the merge result.
  push:
    branches: ['**']
  workflow_dispatch: # stand-in so the required check can run on token-created revert PR branches
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard manual dispatch (revert/* branches by github-actions[bot] only)
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          case "$REF" in refs/heads/revert/*) ;; *) echo "dispatch only allowed on revert/*"; exit 1;; esac
          [ "$ACTOR" = "github-actions[bot]" ] || { echo "dispatch only allowed for github-actions[bot]"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
