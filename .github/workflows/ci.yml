name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets post-merge run the required check on token-created revert PR branches
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
